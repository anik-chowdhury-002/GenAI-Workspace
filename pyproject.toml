[project]
name = "ai-updated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anik Chowdhury", email = "chowdhuryanik027@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ai-updated = "ai_updated:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
